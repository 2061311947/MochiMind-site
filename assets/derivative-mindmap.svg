<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="640" height="640" role="img" aria-label="一张关于导数的思维导图：中心是“导数是什么？”，分出定义、几何意义（y = x² 与 x = 1 处的切线）和例子三个分支，旁边贴着一张和纸胶带笔记。SVG 矢量绘制。">
  <defs>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="1.1" fill="#E3D6BE"/>
    </pattern>
    <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="2.6"/>
    </filter>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#6E5028" flood-opacity=".14"/>
    </filter>
    <style>
      text { font-family: "PingFang SC", "Microsoft YaHei", "Source Han Sans SC", sans-serif; fill: #2F2A24; }
      .m { font-family: "Cambria Math", "Cambria", "Times New Roman", serif; font-style: italic; }
      .up { font-style: normal; }
      .h { font-size: 15px; font-weight: 700; }
      .s { font-size: 13px; fill: #5E554B; }
    </style>
  </defs>

  <!-- paper -->
  <rect width="640" height="640" rx="18" fill="#FFFCF6"/>
  <rect width="640" height="640" rx="18" fill="url(#dots)"/>

  <!-- branches -->
  <g fill="none" stroke-width="3.2" stroke-linecap="round" filter="url(#rough)">
    <path d="M222 302 C258 302 252 128 290 128" stroke="#E0566A"/>
    <path d="M222 302 C256 302 256 330 290 330" stroke="#6FBF9F"/>
    <path d="M222 302 C258 302 252 504 290 504" stroke="#6F9EEF"/>
    <path d="M130 338 C130 360 134 372 134 398" stroke="#C9A56A" stroke-width="2.2" stroke-dasharray="2 7"/>
  </g>

  <!-- root -->
  <g filter="url(#soft)">
    <rect x="40" y="266" width="182" height="72" rx="12" fill="#FFFFFF" stroke="#2F2A24" stroke-width="2.2" filter="url(#rough)"/>
  </g>
  <text x="131" y="309" text-anchor="middle" font-size="21" font-weight="700">导数是什么？</text>

  <!-- card 1: definition -->
  <g filter="url(#soft)">
    <rect x="290" y="68" width="310" height="120" rx="10" fill="#FFFFFF" stroke="#E0566A" stroke-width="2" filter="url(#rough)"/>
  </g>
  <rect x="306" y="82" width="46" height="22" rx="11" fill="#FBE3E6"/>
  <text x="329" y="98" text-anchor="middle" font-size="13" font-weight="700" style="fill:#C23F54">定义</text>
  <text x="362" y="98" class="s">平均变化率的极限</text>
  <text x="308" y="152" font-size="19"><tspan class="m">f</tspan><tspan class="m up">′(</tspan><tspan class="m">x</tspan><tspan class="m up" font-size="12" dy="4">0</tspan><tspan class="m up" dy="-4">) =</tspan></text>
  <text x="402" y="152" font-size="19" class="m up">lim</text>
  <text x="416" y="171" font-size="12" text-anchor="middle"><tspan class="m">h</tspan><tspan class="m up">→0</tspan></text>
  <text x="514" y="138" font-size="17" text-anchor="middle"><tspan class="m">f</tspan><tspan class="m up">(</tspan><tspan class="m">x</tspan><tspan class="m up" font-size="11" dy="3">0</tspan><tspan class="m up" dy="-3">+</tspan><tspan class="m">h</tspan><tspan class="m up">) − </tspan><tspan class="m">f</tspan><tspan class="m up">(</tspan><tspan class="m">x</tspan><tspan class="m up" font-size="11" dy="3">0</tspan><tspan class="m up" dy="-3">)</tspan></text>
  <line x1="444" y1="146" x2="584" y2="146" stroke="#2F2A24" stroke-width="1.4"/>
  <text x="514" y="167" font-size="17" text-anchor="middle" class="m">h</text>

  <!-- card 2: geometry -->
  <g filter="url(#soft)">
    <rect x="290" y="216" width="310" height="232" rx="10" fill="#FFFFFF" stroke="#6FBF9F" stroke-width="2" filter="url(#rough)"/>
  </g>
  <rect x="306" y="230" width="74" height="22" rx="11" fill="#DDF2E9"/>
  <text x="343" y="246" text-anchor="middle" font-size="13" font-weight="700" style="fill:#3F8F70">几何意义</text>
  <text x="390" y="246" class="s">= 切线的斜率</text>
  <!-- plot: sx = 354 + 80x, sy = 411 - 30y -->
  <g stroke="#8F8577" stroke-width="1.3" fill="none">
    <path d="M326 411 H566"/><path d="M566 411 l-7 -4 M566 411 l-7 4"/>
    <path d="M354 426 V262"/><path d="M354 262 l-4 7 M354 262 l4 7"/>
  </g>
  <text x="570" y="428" font-size="13" class="m" style="fill:#8F8577">x</text>
  <text x="340" y="268" font-size="13" class="m" style="fill:#8F8577">y</text>
  <!-- y = x^2 on [-0.3, 2.2] as an exact quadratic Bezier -->
  <path d="M330 408.3 Q430 430.8 530 265.8" fill="none" stroke="#2F2A24" stroke-width="2.6" stroke-linecap="round"/>
  <!-- tangent at x = 1: y = 2x - 1 on [0.35, 2.3] -->
  <path d="M382 420 L538 303" fill="none" stroke="#E0566A" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="9 6"/>
  <g stroke="#C9BDAA" stroke-width="1.2" stroke-dasharray="3 4"><path d="M434 381 V411"/><path d="M434 381 H354"/></g>
  <circle cx="434" cy="381" r="5" fill="#E0566A" stroke="#FFFFFF" stroke-width="2"/>
  <text x="434" y="428" font-size="12" text-anchor="middle" class="m up" style="fill:#8F8577">1</text>
  <text x="344" y="385" font-size="12" text-anchor="end" class="m up" style="fill:#8F8577">1</text>
  <text x="476" y="283" font-size="15"><tspan class="m">y</tspan><tspan class="m up"> = </tspan><tspan class="m">x</tspan><tspan class="m up" font-size="10" dy="-7">2</tspan></text>
  <text x="548" y="330" font-size="13" text-anchor="middle" style="fill:#C23F54">斜率 2</text>

  <!-- card 3: example -->
  <g filter="url(#soft)">
    <rect x="290" y="474" width="310" height="60" rx="10" fill="#FFFFFF" stroke="#6F9EEF" stroke-width="2" filter="url(#rough)"/>
  </g>
  <rect x="306" y="493" width="46" height="22" rx="11" fill="#E1EBFC"/>
  <text x="329" y="509" text-anchor="middle" font-size="13" font-weight="700" style="fill:#3F6FC2">例子</text>
  <text x="364" y="510" font-size="16"><tspan class="m up">(</tspan><tspan class="m">x</tspan><tspan class="m up" font-size="10" dy="-7">2</tspan><tspan class="m up" dy="7">)′ = 2</tspan><tspan class="m">x</tspan></text>
  <text x="452" y="510" class="s">→ x = 1 处斜率为 2</text>

  <!-- note with washi tape -->
  <g transform="rotate(-2 135 470)">
    <g filter="url(#soft)">
      <rect x="40" y="400" width="190" height="136" rx="4" fill="#FFFAEE" stroke="#EADFCB" stroke-width="1.2"/>
    </g>
    <rect x="40" y="400" width="190" height="136" rx="4" fill="url(#dots)" opacity=".7"/>
    <rect x="98" y="389" width="74" height="22" fill="#F2C76E" opacity=".85" transform="rotate(3 135 400)"/>
    <text x="58" y="436" font-size="15" font-weight="700">笔记</text>
    <text x="58" y="462" font-size="13.5" style="fill:#5E554B">切线是曲线在这一点</text>
    <text x="58" y="484" font-size="13.5" style="fill:#5E554B">的「最佳直线近似」，</text>
    <text x="58" y="506" font-size="13.5" style="fill:#5E554B">它的斜率就是导数。</text>
  </g>

  <!-- title + signature -->
  <text x="40" y="66" font-size="13" style="fill:#8F8577">新手样例 · 一问长成一张图</text>
  <text x="600" y="606" font-size="12" text-anchor="end" style="fill:#8F8577">SVG 矢量绘制 · 曲线按 y = x² 精确计算</text>
</svg>
