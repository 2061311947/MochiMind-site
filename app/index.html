<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MochiMind</title>
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <script>
      // Paint the last-used canvas colour before anything loads, so opening the app never
      // flashes a different theme. (Written by the app whenever the palette / theme changes.)
      try {
        var boot = JSON.parse(localStorage.getItem('margin.boot') || 'null');
        if (boot && boot.bg) {
          document.documentElement.style.background = boot.bg;
          document.documentElement.style.setProperty('--boot-ink', boot.ink || '#3A332E');
          document.documentElement.dataset.theme = boot.dark ? 'dark' : 'light';
        }
      } catch (e) {}
    </script>
    <style>
      #boot { position: fixed; inset: 0; z-index: 1000; display: grid; place-items: center; background: inherit; transition: opacity .45s ease, visibility .45s; }
      #boot.gone { opacity: 0; visibility: hidden; }
      #boot .boot-in { display: flex; flex-direction: column; align-items: center; gap: 14px; animation: boot-rise .6s cubic-bezier(.2, .8, .2, 1) both; }
      #boot img { width: 72px; height: 72px; border-radius: 18px; box-shadow: 0 18px 40px -18px rgba(150, 60, 70, .55); animation: boot-breathe 1.8s ease-in-out .6s infinite; }
      #boot span { font: 600 15px/1 'IBM Plex Sans', 'Microsoft YaHei', sans-serif; letter-spacing: .08em; color: var(--boot-ink, #3A332E); opacity: .72; }
      @keyframes boot-rise { from { opacity: 0; transform: translateY(10px) scale(.96); } }
      @keyframes boot-breathe { 50% { transform: scale(1.04); } }
      @media (prefers-reduced-motion: reduce) { #boot * { animation: none !important; } }
    </style>
    <script type="module" crossorigin src="./assets/index-C1PvCu79.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-ZD6HoOeq.css">
  </head>
  <body>
    <div id="boot" aria-hidden="true"><div class="boot-in"><img src="./icon.svg" alt="" /><span>MochiMind</span></div></div>
    <div id="root"></div>
  </body>
</html>
